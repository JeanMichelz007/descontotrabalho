<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto ADS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card">
        <h1>Desconto ADS</h1>
        
        <form id="formularioDesconto">
            <div class="campo">
                <label for="compra">Valor da Compra (R$)</label>
                <input type="number" id="compra" placeholder="Digite o valor..." min="0" step="0.01" required>
            </div>
            
            <button type="submit" class="btn-calcular">Calcular Desconto</button>
        </form>

        <div class="resultados">
            <div class="linha">
                <span>Valor original:</span>
                <span id="txtOriginal">R$ 0,00</span>
            </div>
            <div class="linha">
                <span>Desconto aplicado:</span>
                <span id="txtDesconto">R$ 0,00</span>
            </div>
            <div class="linha total">
                <span>Total a pagar:</span>
                <span id="txtTotal">R$ 0,00</span>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
